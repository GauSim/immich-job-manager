# Immich Album Jobs — see README.md ("Setup").
#   docker compose pull && docker compose up -d     # released image
#   docker compose up -d --build                    # or build from this checkout
services:
  album-jobs:
    image: ghcr.io/gausim/immich-job-manager:${IMMICH_ALBUM_JOBS_VERSION:-1.0.0}
    build: .
    container_name: immich_album_jobs
    restart: unless-stopped
    init: true
    # Hardening: read-only root filesystem, no privileges; only /data and /tmp are writable.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      IMMICH_API_KEY_FILE: /run/secrets/immich_api_key
      APP_PASSWORD_FILE: /run/secrets/app_password
    volumes:
      - ./data:/data
    secrets: [immich_api_key, app_password]
    networks: [immich]

  # Later (phase 9), only with: docker compose --profile ml up -d
  py-worker:
    profiles: ["ml"]
    build: ./worker-py
    restart: unless-stopped
    environment:
      IMMICH_URL: http://immich_server:2283/api
      IMMICH_API_KEY_FILE: /run/secrets/immich_api_key_readonly
    secrets: [immich_api_key_readonly]
    networks: [immich]

networks:
  immich:
    external: true
    name: ${IMMICH_NETWORK:-immich_default}   # check with: docker network ls

secrets:
  immich_api_key:
    file: ./secrets/immich_api_key
  immich_api_key_readonly:
    file: ./secrets/immich_api_key_readonly
  app_password:
    file: ./secrets/app_password
