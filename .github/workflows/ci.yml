name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  spike:
    name: API spike tool (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/immich-spike
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tools/immich-spike/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  scale:
    name: Scale test (100k assets)
    runs-on: ubuntu-latest
    needs: [backend]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:scale -- --silent=false

  immich-contract:
    name: Contract tests (real Immich v3)
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            tools/immich-spike/package-lock.json
      - name: Start Immich
        run: docker compose -f .github/immich/docker-compose.yml up -d
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: tools/immich-spike
      - run: pip install pillow
      - name: Wait for Immich
        run: |
          for i in $(seq 1 90); do
            curl -sf http://localhost:2283/api/server/ping && exit 0
            sleep 2
          done
          docker compose -f .github/immich/docker-compose.yml logs immich-server | tail -50
          exit 1
      - name: Seed fixtures and create a scoped API key
        working-directory: tools/immich-spike
        run: |
          npm run fixtures
          IMMICH_URL=http://localhost:2283/api npm run seed
      - name: Contract tests
        working-directory: backend
        run: |
          IMMICH_CONTRACT_URL=http://localhost:2283/api \
          IMMICH_CONTRACT_KEY="$(cat ../tools/immich-spike/out/api-key)" \
          IMMICH_CONTRACT_UPLOAD_KEY="$(cat ../tools/immich-spike/out/upload-key)" \
          npm run test:contract
      - name: Immich logs
        if: failure()
        run: docker compose -f .github/immich/docker-compose.yml logs immich-server | tail -100

  ui-e2e:
    name: UI end-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e:prepare
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: immich-album-jobs:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test – invalid config stops boot
        run: |
          set +e
          out=$(docker run --rm immich-album-jobs:ci 2>&1); code=$?
          echo "$out"
          [ "$code" -eq 1 ] && echo "$out" | grep -q "Invalid configuration"
      - name: Smoke test /api/health (Immich unreachable → degraded)
        run: |
          docker run -d --name app -p 3000:3000 \
            -e IMMICH_URL=http://127.0.0.1:9/api -e IMMICH_API_KEY=ci -e APP_PASSWORD=ci \
            immich-album-jobs:ci
          for i in $(seq 1 30); do
            body=$(curl -fsS http://localhost:3000/api/health) && break
            sleep 1
          done
          docker logs app
          echo "$body"
          echo "$body" | grep -q '"status":"degraded"'
          echo "$body" | grep -q '"database":{"status":"up"}'
