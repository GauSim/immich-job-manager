# Throwaway Immich v3 for the contract tests in CI (no machine learning).
# Based on Immich's official docker-compose.yml; version pinned to match @immich/sdk.
name: immich-ci
services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.3.5
    environment:
      DB_PASSWORD: postgres
      DB_USERNAME: postgres
      DB_DATABASE_NAME: immich
    volumes:
      - library:/data
    ports:
      - '2283:2283'
    depends_on:
      redis:
        condition: service_started
      database:
        condition: service_healthy
    restart: always
  redis:
    image: docker.io/valkey/valkey:9
    restart: always
  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: '--data-checksums'
    shm_size: 128mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d immich']
      interval: 2s
      timeout: 5s
      retries: 60
    restart: always
volumes:
  library:
