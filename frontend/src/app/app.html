<mat-toolbar class="toolbar">
  <a class="brand" routerLink="/jobs">{{ title }}</a>
  <nav class="nav">
    <a matButton routerLink="/jobs" routerLinkActive="active">Jobs</a>
    <a matButton routerLink="/settings" routerLinkActive="active">Settings</a>
  </nav>
  <span class="spacer"></span>
  <span
    class="status"
    [class]="'status ' + immich().state"
    [matTooltip]="immich().tip"
    data-testid="immich-status"
  >
    <span class="dot"></span>{{ immich().label }}
  </span>
</mat-toolbar>

<main class="content">
  <router-outlet />
</main>
